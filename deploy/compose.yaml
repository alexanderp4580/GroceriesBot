# Deployment contract for the Go runtime described in docs/implementation.md.
# Supply its built image after implementing and testing that runtime.
services:
  groceriesbot:
    image: ${GROCERIESBOT_IMAGE:?Set the tested GroceriesBot image reference}
    user: "10001:10001"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set the bot token in Coolify}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set the OpenRouter key in Coolify}
      DATABASE_PATH: /data/groceriesbot.sqlite3
      RUN_MODE: ${RUN_MODE:-paused}
      GOMEMLIMIT: 64MiB
      GOMAXPROCS: "1"
    volumes:
      - groceriesbot-data:/data
    tmpfs:
      - /tmp:size=8m,mode=1777
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/app/groceriesbot", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    deploy:
      replicas: 1
volumes:
  groceriesbot-data:
    name: groceriesbot-data
